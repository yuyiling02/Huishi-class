    <rect x="530" y="326" width="360" height="76" rx="28" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
    <circle cx="566" cy="364" r="10" fill="#2563eb"/>
    <text x="594" y="373.3333333333333" fill="#14213d" font-size="28" font-weight="700">教师自然语言需求</text>
    
    <rect x="940" y="326" width="360" height="76" rx="28" fill="#f0fdf4" stroke="#16a34a" stroke-width="4"/>
