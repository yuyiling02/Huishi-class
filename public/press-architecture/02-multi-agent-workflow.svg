    <text x="1569" y="809" fill="#e11d48" font-size="25" font-weight="700" text-anchor="middle">观察与评估</text>
    
    <defs>
      <marker id="arrow-104413" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="strokeWidth">
