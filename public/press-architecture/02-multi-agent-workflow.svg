  <rect x="0" y="0" width="2400" height="18" fill="#e11d48"/>
  <text x="112" y="116" fill="#14213d" font-size="56" font-weight="900">多智能体教学流程</text>
  <text x="112" y="168" fill="#5f6c7b" font-size="30" font-weight="500">三类 Agent 协同，将教师意图转化为可执行的 3D 课堂演示</text>
  
    <rect x="160" y="298" width="2080" height="252" rx="44" fill="#ffffff" stroke="#c8d2df" stroke-width="4"/>
