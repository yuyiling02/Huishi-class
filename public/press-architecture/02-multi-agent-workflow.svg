    <text x="228" y="804" fill="#5f6c7b" font-size="27" font-weight="500" text-anchor="start" opacity="1">解析教学目标</text>
    <text x="228" y="838.56" fill="#5f6c7b" font-size="27" font-weight="500" text-anchor="start" opacity="1">拆分演示步骤</text>
    <text x="228" y="873.12" fill="#5f6c7b" font-size="27" font-weight="500" text-anchor="start" opacity="1">生成讲解逻辑</text>
    
    <rect x="930" y="704" width="560" height="270" rx="30" fill="#0f172a" opacity="0.08"/>
    <rect x="920" y="692" width="560" height="270" rx="30" fill="#f0fdf4" stroke="#16a34a" stroke-width="5"/>
    <rect x="920" y="692" width="14" height="270" rx="7" fill="#16a34a"/>
    <text x="966" y="750" fill="#14213d" font-size="36" font-weight="800">演示执行 Agent</text>
    
    <text x="966" y="804" fill="#5f6c7b" font-size="27" font-weight="500" text-anchor="start" opacity="1">选择 3D 模型</text>
    <text x="966" y="838.56" fill="#5f6c7b" font-size="27" font-weight="500" text-anchor="start" opacity="1">调用旋转 / 缩放 / 拆解工具</text>
    <text x="966" y="873.12" fill="#5f6c7b" font-size="27" font-weight="500" text-anchor="start" opacity="1">同步标签、剖面与视角</text>
    
    <rect x="1668" y="704" width="560" height="270" rx="30" fill="#0f172a" opacity="0.08"/>
    <rect x="1658" y="692" width="560" height="270" rx="30" fill="#fff1f2" stroke="#e11d48" stroke-width="5"/>
    <rect x="1658" y="692" width="14" height="270" rx="7" fill="#e11d48"/>
    <text x="1704" y="750" fill="#14213d" font-size="36" font-weight="800">学情评估 Agent</text>
    
    <text x="1704" y="804" fill="#5f6c7b" font-size="27" font-weight="500" text-anchor="start" opacity="1">记录互动轨迹</text>
    <text x="1704" y="838.56" fill="#5f6c7b" font-size="27" font-weight="500" text-anchor="start" opacity="1">生成课堂小结</text>
    <text x="1704" y="873.12" fill="#5f6c7b" font-size="27" font-weight="500" text-anchor="start" opacity="1">回传下一轮教学建议</text>

    <rect x="560" y="1080" width="1280" height="104" rx="52" fill="#ffffff" stroke="#334155" stroke-width="4"/>
    <text x="1200" y="1146" fill="#14213d" font-size="34" font-weight="800" text-anchor="middle">共享上下文：模型状态、教学脚本、交互记录、课堂反馈</text>

    
    <defs>
