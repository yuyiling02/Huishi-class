    <defs>
      <marker id="arrow-57435" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="strokeWidth">
        <path d="M2,2 L14,8 L2,14 Z" fill="#2563eb"/>
      </marker>
    </defs>
    <path d="M 560 1132 C 690 1132, 332 962, 462 962" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 12" marker-end="url(#arrow-57435)"/>
    <text x="511" y="1029" fill="#2563eb" font-size="25" font-weight="700" text-anchor="middle">策略回流</text>
    
    <defs>
      <marker id="arrow-78893" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="strokeWidth">
        <path d="M2,2 L14,8 L2,14 Z" fill="#334155"/>
