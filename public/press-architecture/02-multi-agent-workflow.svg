    <text x="1824" y="373.3333333333333" fill="#14213d" font-size="28" font-weight="700">课堂场景约束</text>

    
    <rect x="192" y="704" width="560" height="270" rx="30" fill="#0f172a" opacity="0.08"/>
    <rect x="182" y="692" width="560" height="270" rx="30" fill="#eff6ff" stroke="#2563eb" stroke-width="5"/>
    <rect x="182" y="692" width="14" height="270" rx="7" fill="#2563eb"/>
