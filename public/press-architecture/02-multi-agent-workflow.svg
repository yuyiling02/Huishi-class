    <text x="1200" y="1003" fill="#334155" font-size="25" font-weight="700" text-anchor="middle">状态同步</text>

    <text x="1200" y="1238" fill="#5f6c7b" font-size="28" font-weight="600" text-anchor="middle">对外表述：系统不是单点问答，而是把“理解、执行、评估”串成可持续迭代的教学智能体流程。</text>
  
  <text x="112" y="1282" fill="#5f6c7b" font-size="24" font-weight="600">慧视课堂 | 多智能体 3D 教学演示系统</text>
  <text x="2288" y="1282" fill="#5f6c7b" font-size="24" font-weight="600" text-anchor="end">Press Architecture Diagram</text>
