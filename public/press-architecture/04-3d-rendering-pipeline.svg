    <text x="1286" y="762" fill="#5f6c7b" font-size="27" font-weight="500" text-anchor="start" opacity="1">旋转、缩放、拖拽</text>
    <text x="1286" y="796.56" fill="#5f6c7b" font-size="27" font-weight="500" text-anchor="start" opacity="1">拆解与回位</text>
    <text x="1286" y="831.12" fill="#5f6c7b" font-size="27" font-weight="500" text-anchor="start" opacity="1">物理抛掷与碰撞</text>
    
