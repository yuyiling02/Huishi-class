  <rect x="0" y="0" width="2400" height="18" fill="#16a34a"/>
  <text x="112" y="116" fill="#14213d" font-size="56" font-weight="900">3D 模型渲染与教学管线</text>
  <text x="112" y="168" fill="#5f6c7b" font-size="30" font-weight="500">模型资产经过加载、结构增强、交互引擎和实时渲染，形成可发布的课堂视觉体验</text>
  
    <rect x="132" y="292" width="2136" height="198" rx="42" fill="#ffffff" stroke="#c8d2df" stroke-width="4"/>
