    <rect x="1250" y="662" width="430" height="285" rx="30" fill="#0f172a" opacity="0.08"/>
    <rect x="1240" y="650" width="430" height="285" rx="30" fill="#f0fdf4" stroke="#16a34a" stroke-width="5"/>
