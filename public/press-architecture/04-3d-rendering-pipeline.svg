    <text x="1185" y="774" fill="#16a34a" font-size="25" font-weight="700" text-anchor="middle">交互化</text>
    
    <defs>
      <marker id="arrow-87217" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="strokeWidth">
        <path d="M2,2 L14,8 L2,14 Z" fill="#e11d48"/>
