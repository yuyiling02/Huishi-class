    <text x="1826" y="762" fill="#5f6c7b" font-size="27" font-weight="500" text-anchor="start" opacity="1">WebGL 实时渲染</text>
    <text x="1826" y="796.56" fill="#5f6c7b" font-size="27" font-weight="500" text-anchor="start" opacity="1">悬浮标签与讲解面板</text>
    <text x="1826" y="831.12" fill="#5f6c7b" font-size="27" font-weight="500" text-anchor="start" opacity="1">新闻稿展示截图素材</text>

    
