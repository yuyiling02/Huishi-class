    <rect x="254" y="1058" width="1892" height="118" rx="36" fill="#ffffff" stroke="#334155" stroke-width="4"/>
    <text x="1200" y="1128" fill="#14213d" font-size="33" font-weight="850" text-anchor="middle">对外表述：系统把静态教具升级为可拆、可看、可问、可控的三维课堂对象。</text>
  
  <text x="112" y="1282" fill="#5f6c7b" font-size="24" font-weight="600">慧视课堂 | 多智能体 3D 教学演示系统</text>
  <text x="2288" y="1282" fill="#5f6c7b" font-size="24" font-weight="600" text-anchor="end">Press Architecture Diagram</text>
