<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>慧视课堂新闻稿技术架构图</title>
  <style>
    body { margin: 0; font-family: "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; background: #eef3f8; color: #14213d; }
    header { padding: 40px 48px 24px; }
    h1 { margin: 0 0 8px; font-size: 32px; }
    p { margin: 0; color: #5f6c7b; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(520px, 1fr)); gap: 28px; padding: 24px 48px 56px; }
    figure { margin: 0; background: white; border: 1px solid #d8e2ee; border-radius: 16px; padding: 16px; box-shadow: 0 12px 30px rgba(15, 23, 42, .08); }
    img { width: 100%; display: block; border-radius: 10px; }
    figcaption { padding: 12px 4px 2px; font-weight: 700; color: #334155; }
  </style>
</head>
<body>
  <header>
    <h1>慧视课堂新闻稿技术架构图</h1>
    <p>SVG 为可编辑母版；同目录 PNG 可直接用于稿件排版。</p>
  </header>
  <main>
      <figure>
        <img src="./01-overall-architecture.svg" alt="01-overall-architecture.svg">
        <figcaption>01-overall-architecture.svg</figcaption>
      </figure>
      <figure>
        <img src="./02-multi-agent-workflow.svg" alt="02-multi-agent-workflow.svg">
        <figcaption>02-multi-agent-workflow.svg</figcaption>
      </figure>
      <figure>
        <img src="./03-interaction-data-flow.svg" alt="03-interaction-data-flow.svg">
        <figcaption>03-interaction-data-flow.svg</figcaption>
      </figure>
      <figure>
        <img src="./04-3d-rendering-pipeline.svg" alt="04-3d-rendering-pipeline.svg">
        <figcaption>04-3d-rendering-pipeline.svg</figcaption>
      </figure>
  </main>
</body>
</html>
